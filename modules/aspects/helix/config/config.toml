# Terminal palette: helix 25.07 cannot switch themes by itself, kitty can.
theme = "base16_terminal"

[editor]
auto-format = true
auto-save = true
bufferline = "always"
end-of-line-diagnostics = "hint"
mouse = true
rulers = [80]
shell = ["nu", "-c"]

[editor.file-picker]
hidden = false

[editor.whitespace.render]
tabpad = "all"

# The herdr explorer opens a file here: it writes the path to the file that
# HERDR_OPEN names, then presses this key. herdr-core cannot type ":", so a
# bound key carries the command. Wrapped in sh because the shell above is nu.
[keys.normal]
A-F12 = ":open %sh{sh -c 'cat \"$HERDR_OPEN\"'}"
