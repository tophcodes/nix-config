# Terminal palette: helix 25.07 cannot switch themes by itself, kitty can.
theme = "base16_terminal"

[editor]
auto-format = true
auto-save = true
bufferline = "always"
end-of-line-diagnostics = "hint"
mouse = true
rulers = [80]
shell = ["nu", "-c"]

[editor.file-picker]
hidden = false

[editor.whitespace.render]
tabpad = "all"

# The default left side plus devkit's file-stale-indicator: "[stale]" once the
# file on disk changed after the buffer last read or wrote it. :reload reads it.
[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator", "file-stale-indicator"]

# devkit's Helix overlay binds A-F9 to A-F12 for the herdr workbench mods, in
# an hx those mods start. A binding of those keys here does not reach that hx.
