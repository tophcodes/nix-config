ui_scale = 1.300000011920929

    [shell.panel]
    open_near_click_control_center = true

[theme]
builtin = "Rosé Pine"
community_palette = "One Dark Two"
mode = "auto"
source = "custom"

    [theme.templates]
    community_ids = [ "obsidian", "vscode", "steam", "yazi" ]

[widget.clock]
font_weight = 700
scale = 1.3

[widget.control-center]
capsule = true
capsule_fill = "primary"
capsule_radius = 2
color = "on_primary"

[widget.media]
