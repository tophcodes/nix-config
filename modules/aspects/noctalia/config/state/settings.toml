scale = 0.69999999999999996

[widget.notifications]
hide_when_no_unread = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.tray]
capsule = true
capsule_padding = 15.0
capsule_radius = 3

[widget.workspaces]
capsule_radius = 2
display = "none"
max_label_chars = 2
scale = 1.1000000000000001