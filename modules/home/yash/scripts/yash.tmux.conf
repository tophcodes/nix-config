# yash — invisible tmux: no prefix, mouse on, minimal status bar.
set -g prefix None
set -g mouse on
set -g escape-time 0
set -g set-clipboard on
set -g copy-command 'wl-copy'

# Status bar: only the yazi mode indicator, bottom left.
set -g status on
set -g status-position bottom
set -g status-style 'bg=default,fg=colour238'
set -g status-left-length 10
set -g status-left '#{?#{==:#{@yash_mode},hidden},#[fg=colour238] 󰉋 ,#{?#{==:#{@yash_mode},dir},#[fg=colour109] 󰉋▏,#{?#{==:#{@yash_mode},multi},#[fg=colour109] 󰉋▌, #[fg=colour214]󰉋█ }}} '
set -g status-right ''
setw -g window-status-format ''
setw -g window-status-current-format ''

# Toggle yazi pane (cycles modes).
bind -n M-y run-shell 'yash-toggle'

# Respawn yazi if it exits (remain-on-exit keeps the pane, hook relaunches it).
set-hook -g pane-died "if -F '#{==:#{remain-on-exit},on}' 'respawn-pane -k' ''"
